spring:
  application:
    name: task-me-please

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/task_me_please}
    username: ${SPRING_DATASOURCE_USERNAME:postgres_user}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}

  output:
    ansi:
      enabled: always

app:
  base-url: ${APP_BASE_URL:http://localhost:8181}
  mail:
    from: ${MAIL_FROM:no-reply@task-me-please.local}

server:
  port: ${PORT:8181}

logging:
  level:
    root: INFO

gg:
  jte:
    development-mode: ${JTE_DEVELOPMENT_MODE:true}
